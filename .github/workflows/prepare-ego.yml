name: prepare-ego

# Manual only. Builds the zip from a ref and runs the EGO pre-flight. Uploads nothing
# to extensions.gnome.org (no documented upload API; no credentials are stored here).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
        required: true

permissions:
  contents: read

env:
  EXT: desktop-mouse-nav@redcodeworks.github.io

jobs:
  prepare:
    runs-on: ubuntu-26.04
    container: fedora:45
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git gnome-shell just unzip jq tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Let git read the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Pack
        run: just pack
      - name: Stage the zip
        id: stage
        run: |
          ver=$(jq -r '.["version-name"] // "unversioned"' "$EXT/metadata.json")
          [[ $ver =~ ^[0-9A-Za-z.\ ]{1,16}$ ]] || ver=invalid
          ver=${ver// /_}
          mkdir -p ego
          cp "dist/$EXT.shell-extension.zip" "ego/ego-$ver.zip"
          ( cd ego && sha256sum "ego-$ver.zip" > "ego-$ver.zip.sha256" )
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - name: Pre-flight
        id: pf
        env:
          VER: ${{ steps.stage.outputs.ver }}
        run: |
          rc=0
          scripts/ego-preflight.sh "ego/ego-$VER.zip" --repo-url "https://github.com/$GITHUB_REPOSITORY" --license-dir . --report ego/preflight.md || rc=$?
          {
            cat ego/preflight.md
            echo
            echo "zip sha256: \`$(cut -d' ' -f1 "ego/ego-$VER.zip.sha256")\`"
            echo
            cat scripts/ego-manual-steps.md
          } >> "$GITHUB_STEP_SUMMARY"
          # keep a copy for the optional Shexli step, then drop the upload candidate on failure
          mkdir -p shexli-in && cp "ego/ego-$VER.zip" "shexli-in/ego-$VER.zip"
          [ "$rc" -eq 0 ] || rm -f "ego/ego-$VER.zip" "ego/ego-$VER.zip.sha256"
          exit "$rc"
      # OPTIONAL and report only: Shexli is the review team's static analyzer, but it is not
      # authoritative (it has passed packages that EGO later rejected). Its findings never fail the job.
      - name: Shexli (optional, report only)
        if: always() && steps.stage.outcome == 'success'
        continue-on-error: true
        env:
          VER: ${{ steps.stage.outputs.ver }}
        run: |
          mkdir -p shexli-out
          zip=shexli-in/ego-$VER.zip
          [ -f "$zip" ] || { mkdir -p shexli-in; cp "ego/ego-$VER.zip" "$zip"; }
          v=0.13.7
          f=uv-x86_64-unknown-linux-musl.tar.gz
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/$f" "https://github.com/astral-sh/uv/releases/download/$v/$f"
          echo "287491da03f2a785c70fa75b13e1f849918c2f2b5415fe84876b8214eeb792f9  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/uv" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/uv" --strip-components=1
          uv="$RUNNER_TEMP/uv/uv"
          "$uv" venv --python 3.12 "$RUNNER_TEMP/shexli-venv"
          "$uv" pip install --python "$RUNNER_TEMP/shexli-venv/bin/python" shexli==0.2.1
          py="$RUNNER_TEMP/shexli-venv/bin/python"
          rc=0
          "$py" -m shexli --format text "$zip" > shexli-out/shexli.txt 2>&1 || rc=$?
          "$py" -m shexli --format json "$zip" > shexli-out/shexli.json 2>/dev/null || true
          {
            echo
            echo "## Shexli 0.2.1 (optional, report only; exit code $rc)"
            echo
            echo "Shexli is the extensions.gnome.org review team's static analyzer. It is NOT authoritative: it has passed packages that were later rejected. Its findings do not fail this job."
            echo
            echo '~~~~text'
            cat shexli-out/shexli.txt
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.stage.outcome == 'success'
        with:
          name: shexli-report
          path: shexli-out/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: ego-zip
          path: |
            ego/*.zip
            ego/*.zip.sha256
            ego/preflight.md
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ego-preflight-report
          path: ego/preflight.md
          if-no-files-found: ignore
