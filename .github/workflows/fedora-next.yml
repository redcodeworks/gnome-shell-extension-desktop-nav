name: fedora-next

# Early warning, never a gate: does the CURRENT RELEASE (the Latest published release, not
# the branch under development) still work against the NEXT Fedora release (the one after
# the release nox runs)? The plan job finds the release and picks the image; the next-test
# job checks out the release tag, downloads the released zip and runs the suite, the
# pre-flight on the zip and the Shell API probe inside the image.
# NOT a required check and nothing depends on it. It uploads nothing and publishes nothing.
# Runs weekly (Monday 06:00 UTC) and on demand; a failure fails the run, so the weekly run
# goes red and shows up in the scheduled-run check. Scheduled workflows only run from the
# default branch (main). No published release yet: the plan job fails with a clear message.
# When no newer image exists the run ends green with a notice.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-next
  cancel-in-progress: true

env:
  EXT: desktop-mouse-nav@redcodeworks.github.io
  # The Fedora release nox runs. Bump it when nox moves to the next release.
  FEDORA_BASELINE: '45'

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      image: ${{ steps.plan.outputs.image }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          for i in 1 2 3; do
            command -v skopeo >/dev/null && command -v jq >/dev/null && exit 0
            sudo apt-get update && sudo apt-get install -y skopeo jq && exit 0
            sleep 10
          done
          echo "::warning::could not install skopeo; the plan will report nothing to test"
      - name: Find the current release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fedora-next-release.sh
      - name: Pick the image
        id: plan
        run: scripts/fedora-next-plan.sh

  next-test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-26.04
    container: ${{ needs.plan.outputs.image }}
    steps:
      - name: Install tools
        id: install
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            dnf install -y --setopt=install_weak_deps=False --setopt=retries=5 git nodejs gnome-shell just unzip zip jq glib2-devel python3-pyyaml cpio xz tar rpm curl && exit 0
            [ "$i" -lt 3 ] && sleep 10
          done
          exit 1
      # The release tag, so the scripts, tests and sources are exactly the released ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Let git read the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
      - name: Record the image and Shell versions
        run: |
          {
            echo "### Fedora image under test"
            echo
            echo "Release: \`${{ needs.plan.outputs.tag }}\` (version-name ${{ needs.plan.outputs.version }})"
            echo "Image: \`${{ needs.plan.outputs.image }}\`"
            . /etc/os-release && echo "OS: $PRETTY_NAME"
            echo "gnome-shell: $(rpm -q --qf '%{VERSION}-%{RELEASE}' gnome-shell 2>/dev/null || echo not installed)"
            echo "gjs: $(rpm -q --qf '%{VERSION}-%{RELEASE}' gjs 2>/dev/null || echo not installed)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint, install test, script tests
        id: suite
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: just test
      - name: Compile the schema, if there is one
        id: schema
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          if ls "$EXT"/schemas/*.gschema.xml >/dev/null 2>&1; then
            glib-compile-schemas --strict --dry-run "$EXT/schemas"
            echo "schema compiles"
          else
            echo "no schema, skipping"
          fi
      - name: Download the released zip
        id: zip
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir -p dist
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl -fsSL --retry 3 -o "dist/$EXT.shell-extension.zip" "$base/$EXT.shell-extension.zip"
          curl -fsSL --retry 3 -o "dist/$EXT.shell-extension.zip.sha256" "$base/$EXT.shell-extension.zip.sha256"
          (cd dist && sha256sum -c "$EXT.shell-extension.zip.sha256")
      - name: Pre-flight on the packed zip
        id: preflight
        if: steps.zip.outcome == 'success'
        continue-on-error: true
        run: scripts/ego-preflight.sh "dist/$EXT.shell-extension.zip" --repo-url "https://github.com/$GITHUB_REPOSITORY" --license-dir .
      - name: API probe
        id: probe
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: scripts/api-probe.sh
      - name: Verdict
        if: always()
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          RELEASE: ${{ needs.plan.outputs.tag }}
          INSTALL: ${{ steps.install.outcome }}
          SUITE: ${{ steps.suite.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
          ZIP: ${{ steps.zip.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          PROBE: ${{ steps.probe.outcome }}
        run: |
          failed=
          [ "$INSTALL" = failure ] && failed="$failed install-tools"
          [ "$SUITE" = failure ] && failed="$failed just-test"
          [ "$SCHEMA" = failure ] && failed="$failed schema"
          [ "$ZIP" = failure ] && failed="$failed release-zip"
          [ "$PREFLIGHT" = failure ] && failed="$failed pre-flight"
          [ "$PROBE" = failure ] && failed="$failed api-probe"
          failed=${failed# }
          if [ -z "$failed" ]; then
            echo "fedora-next: release $RELEASE passed on $IMAGE"
            echo "### Result: release \`$RELEASE\` passed on \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          msg="release $RELEASE may break on $IMAGE: failed steps: $failed"
          {
            echo "### Result: $msg"
            echo
            echo "See the step logs above. This workflow is an early warning, not a gate."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$msg"
          exit 1
