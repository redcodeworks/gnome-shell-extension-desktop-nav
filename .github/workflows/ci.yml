name: ci

# Two kinds of run. A push to testing is the real build: the zip is uploaded once and
# promoted (never rebuilt) when the same tree reaches main. A pull request into testing
# is a validation run only (the dev environment): test and secrets, nothing uploaded,
# nothing published. A push to any other branch triggers nothing.
# Required checks: test, secrets.
# After both pass, publish-testing republishes the same zip as the rolling `testing`
# prerelease (the tag is `testing`, never `v*`), so `just install --testing` can fetch it.
on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  EXT: desktop-mouse-nav@redcodeworks.github.io

jobs:
  test:
    runs-on: ubuntu-26.04
    container: fedora:45
    outputs:
      tree: ${{ steps.manifest.outputs.tree }}
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git nodejs gnome-shell just unzip zip jq glib2-devel python3-pyyaml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the release candidate number counts commits since the last release tag
      - name: Let git read the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint, install test, script tests
        run: just test
      - name: Compile the schema, if there is one
        run: |
          if ls "$EXT"/schemas/*.gschema.xml >/dev/null 2>&1; then
            glib-compile-schemas --strict --dry-run "$EXT/schemas"
            echo "schema compiles"
          else
            echo "no schema, skipping"
          fi
      - name: Pack
        run: just pack
      - name: Stamp the release candidate number into the zip
        id: rc
        run: scripts/stamp-rc.sh "$EXT" "dist/$EXT.shell-extension.zip"
      - name: Write the manifest
        id: manifest
        run: |
          scripts/make-manifest.sh "$EXT" "dist/$EXT.shell-extension.zip" dist/manifest.json
          cat dist/manifest.json
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Upload the build (push to testing only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ steps.manifest.outputs.tree }}
          path: |
            dist/*.shell-extension.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 90

  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          v=8.30.1
          f=gitleaks_${v}_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v$v/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose --no-banner .

  publish-testing:
    needs: [test, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # create and replace the `testing` prerelease and its tag
      actions: read     # download the artifact the test job uploaded
    env:
      GH_TOKEN: ${{ github.token }}
      TREE: ${{ needs.test.outputs.tree }}
    steps:
      - name: Replace the testing prerelease with the tested build
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n "extension-$TREE" -D "$RUNNER_TEMP/art"
          zip=$(ls "$RUNNER_TEMP"/art/*.shell-extension.zip)
          name=$(basename "$zip")
          sum=$(sha256sum "$zip" | cut -d' ' -f1)
          want=$(jq -r .zip_sha256 "$RUNNER_TEMP/art/manifest.json")
          [ "$sum" = "$want" ] || { echo "::error::zip sha256 $sum does not match the manifest ($want)"; exit 1; }
          [ "$(jq -r .tree "$RUNNER_TEMP/art/manifest.json")" = "$TREE" ] || { echo "::error::manifest tree differs from $TREE"; exit 1; }
          echo "$sum  $name" > "$RUNNER_TEMP/art/$name.sha256"
          version=$(jq -r '.["version-name"]' "$RUNNER_TEMP/art/manifest.json")
          short=${GITHUB_SHA::7}
          notes="Rolling testing build for UAT (user acceptance testing), not a release: it has not been tried by users. Each push to the testing branch replaces it.
          Release candidate: version-name $version is the target version plus -rc<N>, N = changes merged into testing since the last release. The clean version-name is released on promotion.
          Commit $GITHUB_SHA, tree $TREE, zip sha256 $sum.
          Built once by https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID after test and secrets passed.
          Install: just install --testing"
          if gh release view testing -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete testing -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create testing "$zip" "$RUNNER_TEMP/art/$name.sha256" "$RUNNER_TEMP/art/manifest.json" \
            -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "testing ($version, $short)" --notes "$notes"
